name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Clojure and Kotoba (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '21']
    steps:
      - uses: actions/checkout@v4
      - name: Setup JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - name: Install Clojure CLI
        uses: DeLaGuardo/setup-clojure@13.0
        with:
          cli: latest
      - name: Cache deps
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
          key: cljdeps-${{ hashFiles('deps.edn') }}
          restore-keys: cljdeps-
      - name: Run tests
        run: clojure -M:test
      - name: Lint (clj-kondo)
        run: clojure -M:lint
      - name: Compile bounded opening-week profile
        run: |
          mkdir -p target/kotoba
          clojure -M:kotoba compile test/ghosthacker_family/bounded_conformance.kotoba \
            --source-path src --target js-browser --output target/kotoba/family.mjs
          clojure -M:kotoba compile test/ghosthacker_family/bounded_conformance.kotoba \
            --source-path src --target wasm32-browser --output target/kotoba/family.wasm
      - name: Execute Web and typed Wasm conformance
        run: |
          compiler_src="$(clojure -Spath -M:kotoba | tr ':' '\n' | grep '/compiler/' | head -1)"
          node scripts/verify-kotoba.mjs target/kotoba/family.mjs \
            target/kotoba/family.wasm "$(dirname "$compiler_src")/runtime/browser-host.mjs"
